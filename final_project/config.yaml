project:
  name: "Leakage-Aware Urdu Tweet Sentiment and Emotion Classification"
  random_seed: 42

data:
  raw_dataset_path: "../Assignment#01/Urdu Tweets Dataset.csv"
  text_column: "Text"
  id_column: "Id"
  label_column: "Category"
  output_dir: "data/splits"

preprocessing:
  normalize_unicode: true
  remove_urls: true
  remove_mentions: true
  clean_hashtags: true
  remove_emojis: true
  remove_numbers: true
  remove_punctuation: true
  normalize_whitespace: true
  min_text_length: 2

labels:
  task: "sentiment"
  drop_unknown_labels: true

split:
  train_size: 0.70
  validation_size: 0.15
  test_size: 0.15
  stratify: true

outputs:
  results_dir: "outputs/results"
  figures_dir: "outputs/figures"
  predictions_dir: "outputs/predictions"
  models_dir: "outputs/models"
  error_analysis_dir: "outputs/error_analysis"

models:
  baseline:
    logistic_regression: "tfidf_logistic_regression"
    linear_svm: "tfidf_linear_svm"
  neural:
    text_cnn: "text_cnn"
    bilstm_attention: "bilstm_attention"
  transformer:
    mbert: "bert-base-multilingual-cased"
    xlm_roberta: "xlm-roberta-base"
    urdu_roberta: "urduhack/roberta-urdu-small"

training:
  batch_size: 32
  learning_rate: 0.00002
  max_sequence_length: 96
