extends: config.yaml

project:
  name: "Group-Safe Urdu Tweet Emotion Classification"

data:
  processed_dir: "data/processed/emotion"
  processed_filename: "dataset.csv"
  output_dir: "data/splits/emotion"

labels:
  task: "emotion"

outputs:
  results_dir: "outputs/emotion/results"
  figures_dir: "outputs/emotion/figures"
  predictions_dir: "outputs/emotion/predictions"
  models_dir: "outputs/emotion/models"
  error_analysis_dir: "outputs/emotion/error_analysis"

error_analysis:
  minority_classes: ["Fear", "Surprise", "Disgust"]

experiments:
  repeated_seeds: [42, 52, 62]
  transformer_seeds: [42]
  transformer_sample_size: 50000
  transformer_epochs: 1

transformer_models:
  models:
    urdu_roberta:
      enabled: true

